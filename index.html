<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人口密度 3D山マップ</title>

  <!-- MapLibre を mapboxgl として読み込む (deck.gl が参照するため) -->
  <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
  <script>window.mapboxgl = maplibregl;</script>  <!-- ← deck.gl が mapboxgl を探すためのエイリアス -->

  <!-- deck.gl -->
  <script src="https://unpkg.com/deck.gl@8.9.35/dist.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:    #040810;
      --panel: rgba(4, 10, 24, 0.90);
      --bdr:   rgba(0, 210, 96, 0.18);
      --acc:   #00d260;
      --acc2:  rgba(0, 210, 96, 0.45);
      --txt:   #b8eecb;
      --dim:   rgba(184, 238, 203, 0.42);
      --warn:  #f0a020;
      --mono:  'Space Mono', monospace;
      --jp:    'Noto Sans JP', sans-serif;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); }
    #map { position:absolute; inset:0; }
    .maplibregl-ctrl-bottom-left,
    .maplibregl-ctrl-bottom-right,
    .maplibregl-ctrl-top-right { display:none; }
    body::after  { content:''; position:fixed; inset:0; pointer-events:none; z-index:900; background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(0,0,0,.03) 3px,rgba(0,0,0,.03) 4px); }
    body::before { content:''; position:fixed; inset:0; pointer-events:none; z-index:901; background:radial-gradient(ellipse at center,transparent 40%,rgba(2,5,18,.7) 100%); }

    /* HEADER */
    #hdr { position:fixed;top:0;left:0;right:0;z-index:50;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,rgba(4,10,24,.96) 0%,transparent 100%); }
    .h-title { font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.22em;color:var(--acc);text-transform:uppercase;margin-bottom:3px; }
    .h-sub   { font-family:var(--jp);font-size:11px;color:var(--dim); }
    .badge   { display:flex;align-items:center;gap:8px;padding:5px 14px;background:var(--panel);border:1px solid var(--bdr);border-radius:3px;backdrop-filter:blur(10px); }
    .dot     { width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc);animation:blink 2.4s ease-in-out infinite; }
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
    .badge-txt { font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--dim); }

    /* GPS PANEL */
    #gps-panel { position:fixed;top:60px;left:14px;z-index:50;width:230px;background:var(--panel);border:1px solid var(--bdr);border-radius:4px;backdrop-filter:blur(16px);overflow:hidden; }
    .gp-sec  { padding:10px 12px;border-bottom:1px solid var(--bdr); }
    .gp-sec:last-child { border-bottom:none; }
    .gp-lbl  { font-family:var(--mono);font-size:8px;letter-spacing:.15em;color:var(--acc);text-transform:uppercase;margin-bottom:6px; }
    .m-badge { display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:2px;font-family:var(--mono);font-size:8px;letter-spacing:.08em;margin-bottom:6px; }
    .m-badge.gps     { background:rgba(0,210,96,.15);border:1px solid rgba(0,210,96,.35);color:var(--acc); }
    .m-badge.ip      { background:rgba(240,160,32,.15);border:1px solid rgba(240,160,32,.35);color:var(--warn); }
    .m-badge.manual  { background:rgba(100,160,255,.15);border:1px solid rgba(100,160,255,.35);color:#88aaff; }
    .m-badge.wait    { background:rgba(100,100,100,.15);border:1px solid rgba(130,130,130,.3);color:var(--dim);animation:blink 1.2s infinite; }
    .gp-row  { display:flex;align-items:center;gap:8px;margin-bottom:4px; }
    .gp-icon { font-size:14px; }
    .gp-place  { font-family:var(--jp);font-size:11px;color:var(--txt); }
    .gp-coords { font-family:var(--mono);font-size:8px;color:var(--dim);margin-bottom:2px; }
    .gp-acc    { font-family:var(--mono);font-size:8px;color:var(--warn); }
    .gp-btns { display:flex;gap:6px; }
    .gp-btn  { flex:1;background:rgba(0,210,96,.1);border:1px solid var(--acc2);color:var(--acc);font-family:var(--mono);font-size:8px;letter-spacing:.1em;padding:5px 4px;cursor:pointer;border-radius:3px;text-transform:uppercase;transition:background .2s; }
    .gp-btn:hover { background:rgba(0,210,96,.22); }
    .gp-btn:disabled { opacity:.35;cursor:not-allowed; }
    .gp-btn.ip { color:var(--warn);border-color:rgba(240,160,32,.45);background:rgba(240,160,32,.08); }
    .gp-btn.ip:hover { background:rgba(240,160,32,.18); }
    .man-row { display:flex;gap:5px;align-items:center;margin-top:6px; }
    .man-in  { flex:1;background:rgba(0,0,0,.5);border:1px solid rgba(0,210,96,.2);border-radius:3px;color:var(--txt);font-family:var(--mono);font-size:9px;padding:5px 7px;outline:none; }
    .man-in:focus { border-color:var(--acc); }
    .man-in::placeholder { color:var(--dim); }
    .man-btn { background:rgba(100,160,255,.12);border:1px solid rgba(100,160,255,.4);color:#88aaff;font-family:var(--mono);font-size:8px;padding:5px 8px;cursor:pointer;border-radius:3px;text-transform:uppercase;letter-spacing:.08em; }
    .man-btn:hover { background:rgba(100,160,255,.22); }
    .gp-hint { font-family:var(--jp);font-size:9px;color:var(--dim);margin-top:5px;line-height:1.5; }

    /* STATS */
    #stats { position:fixed;top:60px;right:14px;width:216px;z-index:50;background:var(--panel);border:1px solid var(--bdr);border-radius:4px;backdrop-filter:blur(16px);overflow:hidden; }
    .p-hd  { padding:7px 12px;font-family:var(--mono);font-size:8px;letter-spacing:.18em;color:var(--acc);text-transform:uppercase;border-bottom:1px solid var(--bdr); }
    .r-row { display:flex;align-items:center;gap:6px;padding:5px 12px;border-bottom:1px solid rgba(0,210,96,.07);transition:background .2s; }
    .r-row:last-child { border-bottom:none; }
    .r-row:hover { background:rgba(0,210,96,.04); }
    .r-n  { font-family:var(--mono);font-size:8px;color:var(--dim);width:13px; }
    .r-w  { flex:1;font-family:var(--jp);font-size:11px;color:var(--txt); }
    .r-bar { display:flex;align-items:center;gap:5px; }
    .bar-bg { width:36px;height:2px;background:rgba(255,255,255,.09);border-radius:1px; }
    .bar-fg { height:100%;border-radius:1px;transition:width 1.2s ease; }
    .r-v  { font-family:var(--mono);font-size:9px;color:var(--dim);width:42px;text-align:right; }

    /* LEGEND */
    #legend { position:fixed;bottom:50px;left:14px;z-index:50;background:var(--panel);border:1px solid var(--bdr);border-radius:4px;padding:10px 14px;backdrop-filter:blur(16px); }
    .l-title { font-family:var(--mono);font-size:8px;letter-spacing:.15em;color:var(--acc);margin-bottom:7px; }
    .l-bar   { width:150px;height:8px;border-radius:4px;margin-bottom:5px;background:linear-gradient(to right,#18b454,#9ed010,#f09018,#e02020); }
    .l-lbs   { display:flex;justify-content:space-between;font-family:var(--mono);font-size:8px;color:var(--dim); }

    /* STATUS BAR */
    #prog      { position:fixed;bottom:38px;left:0;right:0;height:2px;z-index:50;background:rgba(0,210,96,.07); }
    #prog-fill { height:100%;background:linear-gradient(to right,var(--acc),rgba(0,210,96,.35));box-shadow:0 0 8px var(--acc);transition:width 1s linear; }
    #sbar { position:fixed;bottom:0;left:0;right:0;height:38px;z-index:50;background:rgba(4,10,24,.97);border-top:1px solid var(--bdr);display:flex;align-items:center;padding:0 16px;gap:22px; }
    .s-it { display:flex;align-items:center;gap:6px; }
    .s-l  { font-family:var(--mono);font-size:8px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase; }
    .s-v  { font-family:var(--mono);font-size:10px;color:var(--txt); }
    .s-a  { font-family:var(--mono);font-size:10px;color:var(--acc); }

    /* LOADING */
    #loading { position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .8s ease; }
    #loading.fade { opacity:0;pointer-events:none; }
    .ld-t { font-family:var(--mono);font-size:12px;letter-spacing:.22em;color:var(--acc);text-transform:uppercase; }
    .ld-bw { width:240px;height:2px;background:rgba(0,210,96,.1);border-radius:1px; }
    .ld-b  { height:100%;border-radius:1px;background:var(--acc);box-shadow:0 0 8px var(--acc);width:0;transition:width .15s linear; }
    .ld-s  { font-family:var(--jp);font-size:10px;color:var(--dim); }
  </style>
</head>
<body>

<div id="loading">
  <div class="ld-t">Population Density Monitor</div>
  <div class="ld-bw"><div class="ld-b" id="ld-b"></div></div>
  <div class="ld-s" id="ld-s">初期化中…</div>
</div>

<div id="map"></div>

<header id="hdr">
  <div>
    <div class="h-title">Population Density · Mountain View</div>
    <div class="h-sub">人口密度 3D 可視化 / Google PDI · GPS 連動</div>
  </div>
  <div class="badge"><div class="dot"></div><span class="badge-txt" id="live-st">DEMO · SIMULATION</span></div>
</header>

<div id="gps-panel">
  <div class="gp-sec">
    <div class="gp-lbl">LOCATION</div>
    <div id="m-badge" class="m-badge wait">⟳ &nbsp;取得中…</div>
    <div class="gp-row"><span class="gp-icon" id="gp-icon">📡</span><span class="gp-place" id="gp-place">—</span></div>
    <div class="gp-coords" id="gp-coords">— , —</div>
    <div class="gp-acc" id="gp-acc"></div>
  </div>
  <div class="gp-sec">
    <div class="gp-btns">
      <button class="gp-btn" id="btn-gps" onclick="tryGPS()" disabled>📍 GPS</button>
      <button class="gp-btn ip" id="btn-ip" onclick="tryIP()" disabled>🌐 IP位置情報</button>
    </div>
  </div>
  <div class="gp-sec">
    <div class="gp-lbl">手動入力</div>
    <div class="man-row">
      <input class="man-in" id="man-in" type="text" placeholder="35.6895, 139.6917">
      <button class="man-btn" onclick="applyManual()">SET</button>
    </div>
    <div class="gp-hint">緯度, 経度 の形式で入力</div>
  </div>
</div>

<aside id="stats">
  <div class="p-hd">周辺 密度ランキング</div>
  <div id="rank-list"></div>
</aside>

<div id="legend">
  <div class="l-title">人口密度 · 人 / km²</div>
  <div class="l-bar"></div>
  <div class="l-lbs"><span>低 0</span><span>5k</span><span>10k</span><span>20k+ 高</span></div>
</div>

<div id="prog"><div id="prog-fill" style="width:100%"></div></div>
<div id="sbar">
  <div class="s-it"><span class="s-l">SOURCE</span><span class="s-v" id="sb-src">SIMULATION</span></div>
  <div class="s-it"><span class="s-l">CENTER</span><span class="s-v" id="sb-loc">—</span></div>
  <div class="s-it"><span class="s-l">UPDATED</span><span class="s-v" id="sb-time">—</span></div>
  <div class="s-it"><span class="s-l">NEXT IN</span><span class="s-a" id="sb-next">30s</span></div>
  <div class="s-it"><span class="s-l">CELLS</span><span class="s-v" id="sb-cells">—</span></div>
</div>

  {n:'大阪市',     a:34.6937,o:135.5023,d:12000,s:0.075},
  {n:'名古屋市',   a:35.1815,o:136.9066,d: 7000,s:0.075},
  {n:'札幌市',     a:43.0642,o:141.3469,d: 1800,s:0.085},
  {n:'福岡市',     a:33.5904,o:130.4017,d: 4500,s:0.068},
];

// ══════════════════════════════════════════════════════
//  色計算 (緑→黄→赤)
// ══════════════════════════════════════════════════════
function hsl2rgb(h, s, l) {
  const a = s * Math.min(l, 1 - l);
  const f = n => { const k=(n+h/30)%12; return l-a*Math.max(Math.min(k-3,9-k,1),-1); };
  return [Math.round(f(0)*255), Math.round(f(8)*255), Math.round(f(4)*255)];
}
function dColor(d) {
  const t = Math.min(Math.max(d / MAX_D, 0), 1);
  return [...hsl2rgb((1-t)*128, 0.72+t*0.20, 0.37+(1-Math.pow(2*t-1,2))*0.08), 220];
}

// ══════════════════════════════════════════════════════
//  密度モデル (ガウス混合)
// ══════════════════════════════════════════════════════
let noisePhase = 0;
function density(lat, lng) {
  let ws=0, ds=0;
  for (const c of CENTERS) {
    const dy=lat-c.a, dx=(lng-c.o)*0.808;
    const w = Math.exp(-(dy*dy+dx*dx)/(2*c.s*c.s));
    ws+=w; ds+=w*c.d;
  }
  const base = ws > 1e-5 ? ds/ws : 60;
  const noise = Math.sin(lat*173.1+noisePhase*6.1)*Math.cos(lng*257.7+noisePhase*2.9);
  return Math.max(50, Math.min(MAX_D, base*(1+0.04*noise)));
}
function nearest(lat, lng) {
  let best=CENTERS[0], bd=Infinity;
  for (const c of CENTERS) {
    const d=Math.hypot(lat-c.a,(lng-c.o)*0.808);
    if(d<bd){bd=d;best=c;}
  }
  return best.n;
}

// ══════════════════════════════════════════════════════
//  グリッド生成
// ══════════════════════════════════════════════════════
let userLat=35.6895, userLng=139.6917;

function buildGrid() {
  const pts=[];
  let row=0;
  for (let la=userLat-GRID_RADIUS; la<=userLat+GRID_RADIUS; la+=GRID_DLAT, row++) {
    const off=(row&1)?GRID_DLNG*0.5:0;
    for (let lo=userLng-GRID_RADIUS*1.3+off; lo<=userLng+GRID_RADIUS*1.3; lo+=GRID_DLNG) {
      pts.push({la, lo, d:density(la,lo), n:nearest(la,lo)});
    }
  }
  return pts;
}

// ══════════════════════════════════════════════════════
//  高さスケール (1.25乗で差を強調)
// ══════════════════════════════════════════════════════
function elev(d) {
  return Math.pow(Math.min(d/MAX_D,1), 1.25) * 9000 + 30;
}

// ══════════════════════════════════════════════════════
//  deck.gl 初期化
//  ★ DeckGL standalone + mapStyle でシンプルに統合
// ══════════════════════════════════════════════════════
let gl = null;
let userPt = [];  // GPS マーカー用

function makeLayers(pts) {
  return [
    // 人口密度柱
    new deck.ColumnLayer({
      id: 'pop',
      data: pts,
      diskResolution: 6,
      radius: CELL_R,
      extruded: true,
      pickable: true,
      elevationScale: 1,
      getPosition:  d => [d.lo, d.la],
      getElevation: d => elev(d.d),
      getFillColor: d => dColor(d.d),
      material: { ambient:0.35, diffuse:0.70, shininess:100, specularColor:[60,60,60] },
      transitions: { getElevation:{duration:900}, getFillColor:{duration:700} },
    }),
    // 現在地マーカー
    new deck.ScatterplotLayer({
      id: 'user',
      data: userPt,
      getPosition: d => [d.lo, d.la],
      getRadius: 350,
      radiusMinPixels: 8,
      getFillColor: [0, 210, 96, 220],
      getLineColor: [255, 255, 255, 255],
      stroked: true,
      lineWidthMinPixels: 2,
    }),
  ];
}

function initDeck() {
  gl = new deck.DeckGL({
    container: 'map',
    mapStyle: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
    initialViewState: {
      longitude: userLng,
      latitude:  userLat,
      zoom: 10.4,
      pitch: 62,
      bearing: -14,
      maxPitch: 85,
    },
    controller: true,
    layers: makeLayers([]),
    getTooltip: ({object}) => object && ({
      html: `<div style="font-family:'Space Mono',monospace;font-size:11px;color:#b8eecb;line-height:1.9">
        <div style="font-size:9px;color:#00d260;letter-spacing:.12em;margin-bottom:2px">▍ ${object.n}</div>
        <span style="font-size:15px;font-weight:700">${Math.round(object.d).toLocaleString('ja-JP')}</span>
        <span style="color:rgba(184,238,203,.45);font-size:10px"> 人/km²</span></div>`,
      style: { background:'rgba(4,10,24,.96)', border:'1px solid rgba(0,210,96,.4)', borderRadius:'4px', padding:'9px 13px', boxShadow:'0 4px 24px rgba(0,0,0,.5)' },
    }),
  });
}

function flyTo(lat, lng) {
  if (!gl) return;
  gl.setProps({
    initialViewState: {
      longitude: lng, latitude: lat,
      zoom: 10.4, pitch: 62, bearing: -14,
      transitionDuration: 1600,
      transitionInterpolator: new deck.FlyToInterpolator({ speed: 1.5 }),
    }
  });
}

// ══════════════════════════════════════════════════════
//  統計パネル
// ══════════════════════════════════════════════════════
function updateStats(pts) {
  const m={};
  for (const p of pts) {
    if(!m[p.n])m[p.n]={s:0,c:0};
    m[p.n].s+=p.d; m[p.n].c++;
  }
  const rows=Object.entries(m).map(([n,v])=>({n,avg:v.s/v.c})).sort((a,b)=>b.avg-a.avg).slice(0,9);
  const top=rows[0]?.avg||1;
  document.getElementById('rank-list').innerHTML=rows.map((r,i)=>{
    const pct=(r.avg/top*100).toFixed(0);
    const c=dColor(r.avg);
    return `<div class="r-row">
      <span class="r-n">${i+1}</span><span class="r-w">${r.n}</span>
      <div class="r-bar">
        <div class="bar-bg"><div class="bar-fg" style="width:${pct}%;background:rgb(${c[0]},${c[1]},${c[2]})"></div></div>
        <span class="r-v">${(r.avg/1000).toFixed(1)}k</span>
      </div></div>`;
  }).join('');
}

// ══════════════════════════════════════════════════════
//  データ更新
// ══════════════════════════════════════════════════════
let apiUrl = null;

async function refresh() {
  noisePhase++;
  let pts;
  try {
    if (apiUrl) {
      const r=await fetch(apiUrl); if(!r.ok) throw 0;
      pts=await r.json();
      document.getElementById('live-st').textContent='PDI LIVE · CONNECTED';
      document.getElementById('sb-src').textContent='PDI API';
    } else { pts=buildGrid(); }
  } catch { pts=buildGrid(); }

  if (gl) gl.setProps({ layers: makeLayers(pts) });
  updateStats(pts);
  document.getElementById('sb-time').textContent=new Date().toLocaleTimeString('ja-JP',{hour12:false});
  document.getElementById('sb-cells').textContent=pts.length.toLocaleString('ja-JP');
}

// ══════════════════════════════════════════════════════
//  位置情報 共通処理
// ══════════════════════════════════════════════════════
function setBtns(disabled) {
  document.getElementById('btn-gps').disabled=disabled;
  document.getElementById('btn-ip').disabled=disabled;
}
function setBadge(cls, txt) {
  const el=document.getElementById('m-badge');
  el.className='m-badge '+cls; el.textContent=txt;
}
function applyLocation(lat, lng, place, accTxt, icon, badgeCls, badgeTxt) {
  userLat=lat; userLng=lng;
  userPt=[{la:lat, lo:lng}];
  document.getElementById('gp-place').textContent=place;
  document.getElementById('gp-coords').textContent=`${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  document.getElementById('gp-acc').textContent=accTxt;
  document.getElementById('gp-icon').textContent=icon;
  document.getElementById('sb-loc').textContent=`${lat.toFixed(3)}, ${lng.toFixed(3)}`;
  setBadge(badgeCls, badgeTxt);
  flyTo(lat, lng);
  refresh();
  setBtns(false);
}

// ── 逆ジオコーディング ──────────────────────────────
async function revGeo(lat, lng) {
  try {
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=ja`);
    const j=await r.json(); const a=j.address||{};
    return a.city||a.town||a.village||a.county||a.state||`${lat.toFixed(3)},${lng.toFixed(3)}`;
  } catch { return `${lat.toFixed(3)}, ${lng.toFixed(3)}`; }
}

// ── GPS ────────────────────────────────────────────
async function tryGPS() {
  setBtns(true); setBadge('wait','📍 GPS 取得中…');
  document.getElementById('gp-place').textContent='取得中…';
  if (!navigator.geolocation) {
    setBadge('wait','GPS 非対応'); setBtns(false); tryIP(true); return;
  }
  navigator.geolocation.getCurrentPosition(
    async pos => {
      const {latitude:la, longitude:lo, accuracy:ac} = pos.coords;
      const place = await revGeo(la, lo);
      applyLocation(la, lo, place, `精度 ±${Math.round(ac)}m`, '📍', 'gps', '✓ GPS');
    },
    () => { setBadge('wait','GPS 失敗 → IP 試行中'); tryIP(true); },
    { enableHighAccuracy:true, timeout:12000, maximumAge:0 }
  );
}

// ── IP 位置情報 ────────────────────────────────────
async function tryIP(silent=false) {
  if (!silent) { setBtns(true); setBadge('wait','🌐 IP 取得中…'); }
  try {
    const r=await fetch('https://ipapi.co/json/');
    const j=await r.json();
    if (!j.latitude) throw 0;
    const la=parseFloat(j.latitude), lo=parseFloat(j.longitude);
    const place=j.city||j.region||j.country_name||'不明';
    applyLocation(la, lo, place, `${j.org||''} / ${j.country_name||''}`, '🌐', 'ip', '🌐 IP位置情報');
  } catch {
    setBadge('wait','取得失敗 → 手動入力');
    document.getElementById('gp-place').textContent='手動で座標を入力してください';
    setBtns(false);
  }
}

// ── 手動入力 ───────────────────────────────────────
async function applyManual() {
  const raw=document.getElementById('man-in').value.trim();
  const pts=raw.split(/[,\s]+/).map(Number).filter(n=>!isNaN(n));
  if (pts.length<2) { document.getElementById('man-in').style.outline='1px solid #e04040'; setTimeout(()=>document.getElementById('man-in').style.outline='',1500); return; }
  const [la,lo]=[pts[0],pts[1]];
  if (la<20||la>50||lo<120||lo>150) { document.getElementById('gp-acc').textContent='座標が範囲外 (緯度20-50, 経度120-150)'; return; }
  const place=await revGeo(la,lo);
  applyLocation(la, lo, place, '手動入力', '✎', 'manual', '✎ 手動設定');
}

// ══════════════════════════════════════════════════════
//  カウントダウン
// ══════════════════════════════════════════════════════
let cnt=INTERVAL_S;
setInterval(()=>{
  cnt--; if(cnt<=0){cnt=INTERVAL_S;refresh();}
  document.getElementById('prog-fill').style.width=(cnt/INTERVAL_S*100)+'%';
  document.getElementById('sb-next').textContent=cnt+'s';
},1000);

// ══════════════════════════════════════════════════════
//  キーボード
// ══════════════════════════════════════════════════════
document.addEventListener('keydown', e=>{ if(e.key==='Enter'&&document.activeElement===document.getElementById('man-in')) applyManual(); });

// ══════════════════════════════════════════════════════
//  起動シーケンス
// ══════════════════════════════════════════════════════
(function boot() {
  const bar=document.getElementById('ld-b');
  const msg=document.getElementById('ld-s');
  const ld=document.getElementById('loading');
  const steps=[
    [20,  'deck.gl を初期化中…'],
    [45,  '人口密度モデルを準備中…'],
    [70,  'グリッドデータを生成中…'],
    [90,  'マップタイルを読み込み中…'],
    [100, '位置情報を取得中…'],
  ];
  let i=0;
  const iv=setInterval(()=>{
    if (i>=steps.length) { clearInterval(iv); return; }
    const [pct, txt]=steps[i++];
    bar.style.width=pct+'%';
    msg.textContent=txt;
    if (pct===100) {
      clearInterval(iv);
      // deck.gl 初期化
      initDeck();
      // グリッド描画
      refresh();
      // ローディング解除
      setTimeout(()=>{ ld.classList.add('fade'); setTimeout(()=>ld.remove(),900); },400);
      // GPS 試行
      setTimeout(()=>{ setBtns(false); tryGPS(); },800);
    }
  }, 280);
})();
</script>
