<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>人口密度マップ</title>

<link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
<script>window.mapboxgl = maplibregl;</script>
<script src="https://unpkg.com/deck.gl@8.9.35/dist.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
:root {
  --g:   #00ff88;
  --gd:  rgba(0,255,136,.4);
  --mono: 'Share Tech Mono','Courier New',monospace;
}
*,*::before,*::after { margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent; }
html,body { width:100%;height:100%;background:#000;overflow:hidden;touch-action:none; }

/* ══ BOOT ═════════════════════════════════════════ */
#boot {
  position:fixed;inset:0;z-index:100;background:#000;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding-bottom:env(safe-area-inset-bottom,0px);
  transition:opacity .9s ease;
}
#boot.out { opacity:0;pointer-events:none; }
#terminal {
  padding:22px 18px 8px;
  max-height:96dvh;
  overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-end;
}
.tl { font-family:var(--mono);font-size:13px;line-height:1.72;white-space:pre-wrap;word-break:break-all; }
.td  { color:rgba(0,255,136,.36); }
.tn  { color:var(--g); }
.tw  { color:#ffaa00; }
.te  { color:#ff5555; }
.th  { color:#fff;font-size:14px;letter-spacing:.04em; }
.ta  { color:var(--g);letter-spacing:.04em; }
#cur {
  display:inline-block;width:9px;height:13px;
  background:var(--g);vertical-align:middle;margin-left:2px;
  box-shadow:0 0 8px var(--g);animation:cb .8s step-end infinite;
}
@keyframes cb { 50%{opacity:0} }
#sbtn {
  display:none;margin:14px 18px;padding:16px;
  background:rgba(0,255,136,.08);border:1px solid var(--gd);border-radius:4px;
  color:var(--g);font-family:var(--mono);font-size:14px;letter-spacing:.06em;
  text-align:center;cursor:pointer;
}
#sbtn.show { display:block; }
#sbtn:active { background:rgba(0,255,136,.20); }

/* ══ MAP ══════════════════════════════════════════ */
#map { position:absolute;inset:0;opacity:0;transition:opacity 1s ease; }
#map.on { opacity:1; }
.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right,.maplibregl-ctrl-top-right { display:none; }
body::after {
  content:'';position:fixed;inset:0;pointer-events:none;z-index:800;
  background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(0,0,0,.035) 3px,rgba(0,0,0,.035) 4px);
}

/* ══ HUD (上) ═════════════════════════════════════ */
#hud {
  position:fixed;top:0;left:0;right:0;z-index:50;pointer-events:none;
  padding-top:env(safe-area-inset-top,0px);
  background:linear-gradient(to bottom,rgba(0,0,0,.85) 0%,transparent 100%);
}
#hud-inner { padding:10px 16px 14px; }
#h1 { font-family:var(--mono);font-size:11px;color:var(--g);letter-spacing:.04em;margin-bottom:2px; }
#h2 { font-family:var(--mono);font-size:10px;color:rgba(0,255,136,.45); }

/* ══ カウントダウンバー ══════════════════════════ */
#cbar { position:fixed;bottom:0;left:0;right:0;height:3px;z-index:50;background:rgba(0,255,136,.07); }
#cf   { height:100%;background:var(--g);box-shadow:0 0 6px var(--g);transition:width 1s linear; }

/* ══ FAB ══════════════════════════════════════════ */
#fabs {
  position:fixed;z-index:50;
  bottom:calc(18px + env(safe-area-inset-bottom,0px));
  right:16px;
  display:flex;flex-direction:column;gap:12px;align-items:flex-end;
}
.fr { display:flex;align-items:center;gap:8px; }
.fl {
  font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.45);
  background:rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.1);
  border-radius:4px;padding:4px 8px;white-space:nowrap;
}
.fab {
  width:52px;height:52px;border-radius:50%;border:1.5px solid rgba(0,255,136,.35);
  background:rgba(0,8,4,.85);backdrop-filter:blur(10px);
  color:var(--g);font-size:21px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 0 14px rgba(0,255,136,.12),0 2px 12px rgba(0,0,0,.5);
}
.fab:active { background:rgba(0,255,136,.15);transform:scale(.93); }
.fab.spin { animation:cb .5s step-end infinite;pointer-events:none; }

/* ══ 凡例 ═════════════════════════════════════════ */
#leg {
  position:fixed;z-index:50;
  bottom:calc(18px + env(safe-area-inset-bottom,0px));left:16px;
  background:rgba(0,0,0,.62);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:8px 12px;
}
.lb { width:100px;height:5px;border-radius:2px;margin-bottom:4px;
  background:linear-gradient(to right,#18b454,#9ed010,#f09018,#e02020); }
.ll { display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:rgba(255,255,255,.35); }

/* ══ トースト ═════════════════════════════════════ */
#toast {
  position:fixed;z-index:200;
  bottom:calc(80px + env(safe-area-inset-bottom,0px));
  left:16px;right:80px;
  background:rgba(200,50,50,.9);border-radius:8px;
  padding:10px 14px;font-family:var(--mono);font-size:12px;
  color:#fff;line-height:1.5;display:none;
}
#toast.on { display:block; }
</style>
</head>
<body>

<!-- BOOT -->
<div id="boot">
  <div id="terminal"></div>
  <button id="sbtn" onclick="requestLoc()">[ 位置情報へのアクセスを許可して開始 ]</button>
</div>

<!-- MAP -->
<div id="map"></div>

<!-- HUD -->
<div id="hud"><div id="hud-inner">
  <div id="h1">PDM // —</div>
  <div id="h2">—</div>
</div></div>

<!-- カウントダウン -->
<div id="cbar"><div id="cf" style="width:100%"></div></div>

<!-- FAB -->
<div id="fabs">
  <div class="fr"><span class="fl">現在地に戻る</span>
    <button class="fab" id="fg" onclick="retryGPS()">📍</button></div>
  <div class="fr"><span class="fl">手動入力</span>
    <button class="fab" onclick="manualInput()">✏️</button></div>
</div>

<!-- 凡例 -->
<div id="leg">
  <div class="lb"></div>
  <div class="ll"><span>低(局所)</span><span>高(局所)</span></div>
</div>

<!-- トースト -->
<div id="toast"></div>

<script>
'use strict';
// ══════════════════════════════════════════════════════
//  定数
// ══════════════════════════════════════════════════════
const REFRESH   = 30;
const MAX_H     = 6000;   // 点群の最大高さ (m)
const DLAT      = 0.004;
const DLNG      = 0.004;
const RADIUS    = 0.13;
const CELL_R    = 180;    // セルの広がり半径 (m)
const PTS_MIN   = 4;      // 低密度セルの最少点数
const PTS_MAX   = 48;     // 高密度セルの最大点数

// ══════════════════════════════════════════════════════
//  状態
// ══════════════════════════════════════════════════════
let gl = null;
let uLat = 35.6895, uLng = 139.6917;
let noise = 0, cnt = REFRESH, cntId = null;

const sleep = ms => new Promise(r => setTimeout(r, ms));

// ══════════════════════════════════════════════════════
//  CLI ターミナル
// ══════════════════════════════════════════════════════
const term = document.getElementById('terminal');
let curEl = null;

function addLine(txt='', cls='tn') {
  const d = document.createElement('div');
  d.className = 'tl ' + cls; d.textContent = txt;
  term.appendChild(d); term.scrollTop = term.scrollHeight; return d;
}
async function typeLine(txt, cls='tn', spd=17) {
  const d = addLine('', cls);
  for (const c of txt) { d.textContent += c; await sleep(spd); }
  term.scrollTop = term.scrollHeight; return d;
}
async function typeDots(label, cls='td', dots=18, spd=23) {
  const d = addLine(label, cls);
  for (let i=0;i<dots;i++) { d.textContent+='.'; await sleep(spd); } return d;
}
function cursor(parent) {
  if (curEl) curEl.remove();
  curEl = document.createElement('span'); curEl.id='cur';
  (parent||term).appendChild(curEl);
}

// ══════════════════════════════════════════════════════
//  密度モデル（ガウス混合 ＋ 多周波ノイズ）
// ══════════════════════════════════════════════════════
const CEN = [
  [35.7295,139.7109,22000,.022],[35.7074,139.6637,21000,.021],
  [35.7351,139.7832,20600,.017],[35.7139,139.8012,19800,.019],
  [35.7118,139.7825,19500,.016],[35.7069,139.7523,18700,.018],
  [35.6094,139.7303,18000,.028],[35.7511,139.7197,17300,.028],
  [35.6939,139.7034,17100,.020],[35.7527,139.7337,16500,.026],
  [35.6635,139.6985,15800,.020],[35.7757,139.8044,15600,.038],
  [35.7439,139.8472,14200,.030],[35.7069,139.8686,13400,.035],
  [35.6994,139.6368,13000,.030],[35.6581,139.7514,12500,.022],
  [35.6423,139.6983,12300,.020],[35.5613,139.7160,11500,.040],
  [35.6467,139.6531,11200,.038],[35.7357,139.6528,10800,.033],
  [35.6726,139.8175,10500,.033],[35.6702,139.7730, 5700,.016],
  [35.6938,139.7532, 4400,.013],
  [35.7295,139.7109,24000,.008],[35.6896,139.7006,23000,.007],
  [35.6580,139.7016,21000,.007],[35.7494,139.8007,20000,.008],
  [35.5636,139.7162,19000,.008],[35.8235,139.6804,14000,.010],
  [35.4437,139.6380, 8500,.085],[35.5308,139.7029,10500,.052],
  [35.5176,139.6795,11000,.018],[35.8617,139.6455, 6100,.065],
  [35.8069,139.7241, 9000,.038],[35.8277,139.8074, 7000,.024],
  [35.6074,140.1065, 3600,.065],[35.6946,139.9831, 7400,.038],
  [35.7210,139.9316, 8200,.028],[35.7878,139.9026, 8000,.030],
  [36.3418,140.4468, 1200,.040],[36.3964,140.5347, 1630,.025],
  [36.3851,140.5340, 2400,.010],[36.0833,140.0769,  850,.050],
  [35.9500,139.9760, 2000,.024],[36.5549,139.8832, 1250,.058],
  [36.3895,139.0634, 1080,.048],[36.3226,139.0030,  810,.058],
  [38.2688,140.8721, 1450,.078],[37.0508,140.8878,  350,.058],
  [37.3937,140.3847,  700,.048],[34.6937,135.5023,12000,.078],
  [35.1815,136.9066, 7000,.078],[43.0642,141.3469, 1800,.088],
  [33.5904,130.4017, 4500,.070],
];

function rawDensity(lat, lng) {
  let ws=0, ds=0;
  const cl = Math.cos(lat * Math.PI/180);
  for (const [la,lo,d,sp] of CEN) {
    const dy=lat-la, dx=(lng-lo)*cl;
    const w=Math.exp(-(dy*dy+dx*dx)/(2*sp*sp));
    ws+=w; ds+=w*d;
  }
  const base = ws>1e-6 ? ds/ws : 80;
  // 多周波ノイズ（街区・ブロック・細粒）
  const n1 = Math.sin(lat*890 +lng*1234)*Math.cos(lat*1567+lng*678 )*0.35;
  const n2 = Math.sin(lat*2670+lng*3702)*Math.cos(lat*4701+lng*2034)*0.20;
  const n3 = Math.sin(lat*8010+lng*11106)*Math.cos(lat*14103+lng*6102)*0.10;
  const nt = Math.sin(lat*173.1+noise*6.1)*Math.cos(lng*257.7+noise*2.9)*0.05;
  return Math.max(80, base * Math.max(0.25, 1+n1+n2+n3+nt));
}

// ══════════════════════════════════════════════════════
//  点群生成
//   座標: METER_OFFSETS（中心からのメートル差分）
//   Z:    高さ (m)
// ══════════════════════════════════════════════════════
function ptColor(t, zFrac) {
  // t: 正規化密度 0-1, zFrac: 柱内の高さ位置 0-1
  const hue = (1-t)*120;
  const sat = 0.68 + t*0.28;
  const lig = 0.18 + zFrac*0.52;     // 下=暗い / 上=明るい → 奥行き感
  const alp = (100 + zFrac*155)|0;   // 下=半透明 / 上=不透明
  const a = sat*Math.min(lig,1-lig);
  const f = n => { const k=(n+hue/30)%12; return lig-a*Math.max(Math.min(k-3,9-k,1),-1); };
  return [(f(0)*255)|0,(f(8)*255)|0,(f(4)*255)|0,alp];
}

function buildCloud(cLat, cLng) {
  const cosLat = Math.cos(cLat*Math.PI/180);
  const M_LAT  = 111000;  // 1° 緯度 ≈ 111km
  const M_LNG  = M_LAT * cosLat;

  // ── グリッド生成
  const cells = []; let row=0;
  for (let la=cLat-RADIUS; la<=cLat+RADIUS; la+=DLAT, row++) {
    const off = (row%2)*(DLNG/2);
    for (let lo=cLng-RADIUS*1.3+off; lo<=cLng+RADIUS*1.3; lo+=DLNG)
      cells.push({ la, lo, d:rawDensity(la,lo) });
  }

  // ── 局所正規化（グリッド内の最小〜最大で 0-1 に）
  const vals = cells.map(c=>c.d);
  const dMin = Math.min(...vals), dMax = Math.max(...vals);
  const rng  = dMax-dMin || 1;
  cells.forEach(c => c.t = (c.d-dMin)/rng);

  // ── 点群化
  const pts = [];
  for (const cell of cells) {
    const { la, lo, d, t } = cell;
    const eBase = (lo - cLng) * M_LNG;  // 東方向オフセット (m)
    const nBase = (la - cLat) * M_LAT;  // 北方向オフセット (m)
    const h     = Math.pow(t, 1.2) * MAX_H + 50;
    const n     = PTS_MIN + Math.round(t * (PTS_MAX - PTS_MIN));

    for (let i=0; i<n; i++) {
      // セル内でランダム散布（一様円形分布）
      const r     = CELL_R * Math.sqrt(Math.random());
      const angle = Math.random() * Math.PI * 2;
      // Z: 底を密に、上をまばらに（べき乗で分布）
      const zFrac = Math.pow(Math.random(), 0.65);
      const z     = zFrac * h;

      pts.push({
        pos: [eBase + r*Math.cos(angle), nBase + r*Math.sin(angle), z],
        col: ptColor(t, zFrac),
        d,
      });
    }
  }
  return { pts, cells, dMin, dMax };
}

// ══════════════════════════════════════════════════════
//  deck.gl
// ══════════════════════════════════════════════════════
function makeLayers(pts, cLat, cLng) {
  return [
    // 点群レイヤー（METER_OFFSETS: 中心からのm差分 + 高さm）
    new deck.PointCloudLayer({
      id: 'cloud',
      data: pts,
      coordinateSystem: deck.COORDINATE_SYSTEM.METER_OFFSETS,
      coordinateOrigin: [cLng, cLat],
      getPosition: d => d.pos,
      getColor:    d => d.col,
      pointSize:   2.5,
      pickable:    false,
      parameters:  { depthTest: true, depthMask: false, blend: true },
    }),
    // 現在地マーカー
    new deck.ScatterplotLayer({
      id: 'me',
      data: [{ lat: cLat, lng: cLng }],
      getPosition: d => [d.lng, d.lat],
      getRadius: 250, radiusMinPixels: 9,
      getFillColor: [0,220,120,230],
      getLineColor:  [255,255,255,255],
      stroked: true, lineWidthMinPixels: 2.5,
    }),
  ];
}

function initDeck(lat, lng) {
  gl = new deck.DeckGL({
    container: 'map',
    mapStyle: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
    initialViewState: {
      longitude: lng, latitude: lat,
      zoom: 10, pitch: 60, bearing: -10, maxPitch: 85,
    },
    controller: true,
    layers: [],
  });
}

function flyTo(lat, lng) {
  if (!gl) return;
  gl.setProps({ initialViewState: {
    longitude: lng, latitude: lat,
    zoom: 10, pitch: 60, bearing: -10,
    transitionDuration: 1200,
    transitionInterpolator: new deck.FlyToInterpolator({ speed: 1.5 }),
  }});
}

// ══════════════════════════════════════════════════════
//  更新
// ══════════════════════════════════════════════════════
function refresh() {
  noise++;
  const { pts, cells, dMin, dMax } = buildCloud(uLat, uLng);
  gl.setProps({ layers: makeLayers(pts, uLat, uLng) });

  const now = new Date().toLocaleTimeString('ja-JP',{hour12:false});
  document.getElementById('h1').textContent = `PDM // ${uLat.toFixed(4)}, ${uLng.toFixed(4)}`;
  document.getElementById('h2').textContent =
    `${pts.length.toLocaleString()} points  ·  局所密度 ${Math.round(dMin).toLocaleString()}-${Math.round(dMax).toLocaleString()} 人/km²  ·  ${now}`;
}

function startLoop() {
  if (cntId) clearInterval(cntId);
  cnt = REFRESH;
  cntId = setInterval(() => {
    cnt--;
    if (cnt<=0) { cnt=REFRESH; refresh(); }
    document.getElementById('cf').style.width = (cnt/REFRESH*100)+'%';
  }, 1000);
}

// ══════════════════════════════════════════════════════
//  位置情報
// ══════════════════════════════════════════════════════
function getGPS() {
  return new Promise((res,rej) => {
    if (!navigator.geolocation) { rej(new Error('GPS非対応')); return; }
    navigator.geolocation.getCurrentPosition(
      p => res({ lat:p.coords.latitude, lng:p.coords.longitude, acc:Math.round(p.coords.accuracy) }),
      e => rej(new Error(['','GPS使用が拒否されました','GPS取得エラー','GPSタイムアウト'][e.code]||'GPSエラー')),
      { enableHighAccuracy:true, timeout:12000, maximumAge:0 }
    );
  });
}
async function getIP() {
  const r=await fetch('https://ipapi.co/json/');
  const j=await r.json();
  if(!j.latitude) throw new Error('IP位置情報取得失敗');
  return { lat:parseFloat(j.latitude), lng:parseFloat(j.longitude), acc:null };
}

function toast(msg,ms=4000) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('on');
  setTimeout(()=>el.classList.remove('on'),ms);
}

async function applyLoc(lat, lng) {
  uLat=lat; uLng=lng;
  flyTo(lat,lng);
  refresh();
  startLoop();
}

async function retryGPS() {
  const btn=document.getElementById('fg');
  btn.classList.add('spin');
  try {
    const g=await getGPS();
    await applyLoc(g.lat, g.lng);
  } catch(e) { toast(e.message); }
  btn.classList.remove('spin');
}
function manualInput() {
  const v=prompt('緯度, 経度\n例: 35.6895, 139.6917');
  if(!v)return;
  const p=v.split(/[,\s]+/).map(Number).filter(n=>!isNaN(n));
  if(p.length<2||p[0]<20||p[0]>50||p[1]<120||p[1]>150) {
    toast('正しい座標を入力してください（緯度20-50、経度120-150）'); return;
  }
  applyLoc(p[0],p[1]);
}

// ══════════════════════════════════════════════════════
//  CLI 起動シーケンス
// ══════════════════════════════════════════════════════
async function boot() {
  const W  = Math.min(window.innerWidth,460);
  const HR = '─'.repeat(Math.floor(W/8));
  await sleep(180);
  await typeLine(HR,'td',3);
  await typeLine('  人口密度モニター  PDM v2.0','th',9);
  await typeLine('  Population Density · Point Cloud','td',8);
  await typeLine(HR,'td',3);
  await sleep(100);

  let d;
  d = await typeDots('  [INIT]  WebGL renderer','td',18,22);
  initDeck(uLat,uLng);
  d.textContent+=' OK'; d.className='tl tn'; await sleep(50);

  d = await typeDots('  [INIT]  dark-matter basemap','td',16,22);
  d.textContent+=' OK'; d.className='tl tn'; await sleep(50);

  d = await typeDots('  [INIT]  density model ('+CEN.length+' centers)','td',14,22);
  d.textContent+=' OK'; d.className='tl tn'; await sleep(80);

  // GPS
  addLine('','td');
  const gl1=addLine('  [GPS ]  位置情報を取得中','td'); cursor(gl1);

  const gpsP=(async()=>{
    try {
      return await Promise.race([getGPS(),new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),13000))]);
    } catch(e1) {
      if(e1.message.includes('拒否')) return 'DENIED';
      try { return await getIP(); } catch { return null; }
    }
  })();

  // スピナー
  const sp=['⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏'];
  let si=0, spinning=true;
  const spEl=document.createElement('span');
  spEl.className='tl td'; spEl.textContent=' '+sp[0]; gl1.appendChild(spEl);
  const spIv=setInterval(()=>{ if(spinning) spEl.textContent=' '+sp[si++%sp.length]; },80);

  const loc=await gpsP;
  spinning=false; clearInterval(spIv); spEl.remove(); if(curEl)curEl.remove();

  if(loc==='DENIED') {
    gl1.textContent='  [GPS ]  ⚠ 許可が必要です';
    gl1.className='tl tw';
    addLine('  [GPS ]  下のボタンをタップしてください','td');
    document.getElementById('sbtn').classList.add('show');
    return; // ボタン待ち
  }

  if(loc) {
    uLat=loc.lat; uLng=loc.lng;
    const method = loc.acc!==undefined ? 'GPS' : 'IP';
    gl1.textContent=`  [GPS ]  ${method}: ${loc.lat.toFixed(5)}, ${loc.lng.toFixed(5)}`;
    gl1.className='tl tn';
    if(loc.acc) addLine(`  [GPS ]  精度: ±${loc.acc}m`,'td');
    flyTo(loc.lat,loc.lng);
  } else {
    gl1.textContent='  [GPS ]  FAILED → default (Tokyo)';
    gl1.className='tl tw';
  }
  await sleep(80);
  await finishBoot();
}

async function requestLoc() {
  document.getElementById('sbtn').classList.remove('show');
  addLine('','td');
  const l=addLine('  [GPS ]  再取得中','td'); cursor(l);
  let loc=null;
  try { loc=await getGPS(); } catch {}
  if(curEl)curEl.remove();
  if(loc) { uLat=loc.lat; uLng=loc.lng; l.textContent=`  [GPS ]  OK: ${loc.lat.toFixed(5)}, ${loc.lng.toFixed(5)}`; l.className='tl tn'; flyTo(loc.lat,loc.lng); }
  else { l.textContent='  [GPS ]  FAILED → default'; l.className='tl tw'; }
  await sleep(60);
  await finishBoot();
}

async function finishBoot() {
  // 点群構築
  const pg=await typeDots('  [DATA]  点群を生成中','td',16,26);
  const { pts, cells, dMin, dMax } = buildCloud(uLat,uLng);
  pg.textContent+=` ${pts.length.toLocaleString()} points`;
  pg.className='tl tn'; await sleep(50);

  const rg=await typeDots('  [REND]  GPU へ転送中','td',16,24);
  gl.setProps({ layers: makeLayers(pts, uLat, uLng) });
  rg.textContent+=' OK'; rg.className='tl tn'; await sleep(80);

  const W=Math.min(window.innerWidth,460);
  addLine('  '+'─'.repeat(Math.floor(W/8)),'td');
  const rl=await typeLine('  READY','ta',20);
  cursor(rl); await sleep(500);

  // HUD 更新
  document.getElementById('h1').textContent=`PDM // ${uLat.toFixed(4)}, ${uLng.toFixed(4)}`;
  document.getElementById('h2').textContent=
    `${pts.length.toLocaleString()} points  ·  局所密度 ${Math.round(dMin).toLocaleString()}-${Math.round(dMax).toLocaleString()} 人/km²`;

  document.getElementById('map').classList.add('on');
  startLoop();
  await sleep(600);
  if(curEl)curEl.remove();
  document.getElementById('boot').classList.add('out');
  setTimeout(()=>document.getElementById('boot').remove(),1000);
}

boot();
</script>
</body>
